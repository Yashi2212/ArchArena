services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: archarena
      POSTGRES_USER: archarena
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U archarena]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/archarena
      DB_USER: archarena
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
      ARCHARENA_ACCESS_TOKEN: ${ARCHARENA_ACCESS_TOKEN:?Set ARCHARENA_ACCESS_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
  worker:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/archarena
      DB_USER: archarena
      DB_PASSWORD: ${DB_PASSWORD}
      WORKER_ENABLED: 'true'
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 1
  frontend:
    build: ./frontend
    environment:
      ARCHARENA_ACCESS_TOKEN: ${ARCHARENA_ACCESS_TOKEN}
    ports:
      - 127.0.0.1:5173:80
    depends_on:
      - api
    mem_limit: 128m
volumes:
  postgres-data:
