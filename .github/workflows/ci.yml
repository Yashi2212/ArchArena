name: Local demo quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_knowledge.py
      - run: python scripts/test_knowledge.py
      - run: python scripts/check_proposed_tokens.py
      - run: python scripts/validate_docs.py
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn -B -f backend/pom.xml verify dependency:list -DincludeScope=runtime -DoutputFile=../.local/runtime-dependencies.txt
      - run: python scripts/scan_java_dependencies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: backend/target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-fund
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low
  browser:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-fund
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-evidence
          path: |
            frontend/test-results
            docs/evidence/library-studio-browser-results.json
  # This quality workflow creates no cloud resources. Static Pages publication is separate.
