server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
spring:
  application:
    name: archarena
  datasource:
    url: ${DB_URL:jdbc:h2:file:./.local/archarena;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
archarena:
  worker:
    enabled: ${WORKER_ENABLED:false}
  access-token: ${ARCHARENA_ACCESS_TOKEN:}
  owner: ${ARCHARENA_OWNER:local-owner}
  retention-days: 7
logging:
  level:
    root: INFO
  pattern:
    console: '%d{ISO8601} level=%level correlation=%X{correlationId:-none} logger=%logger{36} message=%msg%n'
